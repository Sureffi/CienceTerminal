version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'Cache-Control'
            value: 'no-cache'
      - pattern: '/assets/*'
        headers:
          - key: 'Cache-Control'
            value: 'max-age=31536000, immutable'
    redirects:
      - source: '/<*>'
        target: '/index.html'
        status: '404-200'
