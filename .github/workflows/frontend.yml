
name: Deploy React Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend/myapp

      # 4️⃣ Build React app
      - name: Build React app
        run: npm run build
        working-directory: ./frontend/myapp

      # 5️⃣ Sync build to S3
      - name: Deploy to S3
        uses: aws-actions/s3-sync@v2
        with:
          source-dir: ./frontend/myapp/build
          bucket: myapp-frontend            # replace with your bucket name
          delete: true                       # remove old files
        env:
          AWS_REGION: us-east-1             # replace with your region
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # 6️⃣ Invalidate CloudFront cache
      - name: Invalidate CloudFront
        uses: chetan/invalidate-cloudfront-action@v1
        with:
          distribution: YOUR_CLOUDFRONT_ID  # replace with your CloudFront ID
          paths: "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

